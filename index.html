<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>قاس - قياس الواقع المعزز</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; background-color: #000;
        }
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0044ff; color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            text-align: center; padding: 20px; box-sizing: border-box;
        }
        .logo-container {
            width: 120px; height: 120px; background: white; 
            border-radius: 25px; display: flex; align-items: center; 
            justify-content: center; margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .logo-svg { width: 80px; height: 80px; }
        h1 { font-size: 2.2rem; margin: 10px 0; font-weight: bold; }
        p { font-size: 1.1rem; max-width: 320px; line-height: 1.6; opacity: 0.9; margin-bottom: 20px; }
        .steps { text-align: right; background: rgba(255,255,255,0.15); padding: 15px 25px; border-radius: 15px; margin-bottom: 30px; font-size: 0.95rem; }
        .steps div { margin: 8px 0; }
        .start-btn {
            background-color: #ffffff; color: #0044ff; border: none;
            padding: 16px 50px; font-size: 1.2rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        #ar-ui {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 99; pointer-events: none;
        }
        .counter-box {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); color: #fff; text-align: center;
            padding: 12px 30px; border-radius: 30px; font-size: 1.4rem;
            font-weight: bold; border: 2px solid #0044ff; pointer-events: auto;
            min-width: 150px;
        }
        .action-btn {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: #ffffff; color: #0044ff; border: none; width: 85px; height: 85px;
            border-radius: 50%; font-weight: bold; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 0 25px rgba(0,0,0,0.4); border: 6px solid #0044ff; pointer-events: auto;
        }
        .reset-btn {
            position: absolute; bottom: 70px; right: 35px;
            background: rgba(255, 59, 48, 0.9); color: white; border: none;
            padding: 10px 22px; border-radius: 20px; font-weight: bold; cursor: pointer; pointer-events: auto;
        }
        video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }
        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://w3.org">
                <path d="M45 75C30 75 22 62 25 48C28 34 40 28 52 35C58 38.5 62 45 61 52C60 61 54 75 45 75Z" stroke="#0044ff" stroke-width="7" stroke-linecap="round"/>
                <circle cx="48" cy="18" r="4.5" fill="#0044ff"/>
                <circle cx="59" cy="18" r="4.5" fill="#0044ff"/>
                <path d="M66 22V78M66 30H71M66 40H71M66 50H71M66 60H71M66 70H71" stroke="#0044ff" stroke-width="5" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>موقع قَاسْ</h1>
        <p>أداة ذكية لقياس النوافذ والجدران عبر الخطوط الافتراضية بكاميرا جوالك مباشرة.</p>
        <div class="steps">
            <div>• وجّه الكاميرا نحو الجدار أو النافذة بثبات.</div>
            <div>• اضغط <b>"نقطة"</b> لتحديد بداية القياس.</div>
            <div>• تحرّك قليلاً واضغط <b>"نقطة"</b> لتثبيت المقاس النهائي.</div>
        </div>
        <button class="start-btn" id="start-ar-btn">ابدأ القياس</button>
    </div>

    <div id="ar-ui">
        <div class="counter-box" id="result-text">0.00 متر</div>
        <button class="action-btn" id="action-btn">نقطة</button>
        <button class="reset-btn" id="reset-btn">إعادة</button>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script src="app.js"></script>
</body>
</html>
